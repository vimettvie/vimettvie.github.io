<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSS Playground</title>
<style>
  :root{
    --bg:#f7f7f9; --panel:#ffffff; --text:#1a1a1e; --muted:#6b7280;
    --border:#e3e3e8; --accent:#4f46e5; --accent-text:#ffffff; --danger:#e11d48;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121214; --panel:#1c1c20; --text:#f0f0f2; --muted:#9a9aa2;
      --border:#2e2e33; --accent:#818cf8; --accent-text:#111;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121214; --panel:#1c1c20; --text:#f0f0f2; --muted:#9a9aa2;
    --border:#2e2e33; --accent:#818cf8; --accent-text:#111;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  header{
    position:sticky;top:0;top:env(safe-area-inset-top,0px);
    background:var(--bg);border-bottom:1px solid var(--border);
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;z-index:5;
  }
  header h1{font-size:16px;margin:0;font-weight:600;}
  #addBtn{
    background:var(--accent);color:var(--accent-text);border:none;border-radius:8px;
    padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;
  }
  #addBtn:disabled{opacity:.5;cursor:not-allowed;}
  #rows{max-width:900px;margin:0 auto;padding:12px 16px 40px;}
  .row{
    display:flex;gap:14px;align-items:stretch;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;
  }
  .btn-wrap{
    flex:0 0 160px;display:flex;align-items:center;justify-content:center;
    overflow:auto;min-height:70px;
  }
  .target-btn{
    padding:10px 16px;border:1px solid var(--border);border-radius:6px;
    background:var(--panel);color:var(--text);cursor:default;font:inherit;max-width:100%;
  }
  .editor-wrap{flex:1 1 auto;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .editor-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .editor-top small{color:var(--muted);font-family:monospace;}
  .rm{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;}
  textarea{
    width:100%;min-height:80px;resize:vertical;border:1px solid var(--border);
    border-radius:8px;padding:8px;background:var(--bg);color:var(--text);
    font-family:monospace;font-size:13px;
  }
  #styleSheets{display:none;}
  footer{max-width:900px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<header>
  <h1>🎨 CSS Playground</h1>
  <button id="addBtn">+ Додати рядок (<span id="cnt">1</span>/1000)</button>
</header>
<div id="rows"></div>
<div id="styleSheets"></div>
<footer>Пиши повноцінний CSS (з селектором!) для класу, вказаного під текстовим полем — підтримуються :hover, :active, @keyframes, animation, @media тощо. Стиль застосовується миттєво.</footer>

<script>
let rowCount = 0;
let uid = 0;
const MAX = 1000;
const rowsEl = document.getElementById('rows');
const styleSheetsEl = document.getElementById('styleSheets');
const addBtn = document.getElementById('addBtn');
const cntEl = document.getElementById('cnt');

function updateCounter(){
  cntEl.textContent = rowCount;
  addBtn.disabled = rowCount >= MAX;
}

function createRow(){
  uid += 1;
  const id = uid;
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.id = id;

  row.innerHTML = `
    <div class="btn-wrap">
      <button class="target-btn btn-${id}">Кнопка ${id}</button>
    </div>
    <div class="editor-wrap">
      <div class="editor-top">
        <small>клас кнопки: .btn-${id}</small>
        <button class="rm" title="Видалити">✕</button>
      </div>
      <textarea placeholder=".btn-${id} {&#10;  background: #4f46e5;&#10;  color: white;&#10;  border-radius: 10px;&#10;  padding: 12px 24px;&#10;  transition: 0.3s;&#10;}&#10;.btn-${id}:hover {&#10;  transform: scale(1.08);&#10;}"></textarea>
    </div>
  `;

  const style = document.createElement('style');
  style.id = 'style-' + id;
  styleSheetsEl.appendChild(style);

  const textarea = row.querySelector('textarea');
  textarea.addEventListener('input', () => {
    // Пишеться сирий CSS без обгортки: підтримує :hover, @keyframes, @media і т.д.
    style.textContent = textarea.value;
  });

  row.querySelector('.rm').addEventListener('click', () => {
    row.remove();
    style.remove();
    rowCount -= 1;
    updateCounter();
  });

  rowsEl.appendChild(row);
  rowCount += 1;
  updateCounter();
}

addBtn.addEventListener('click', () => {
  if (rowCount < MAX) createRow();
});

createRow();
</script>
</body>
</html>
