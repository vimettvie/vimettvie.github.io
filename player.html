<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Player by @lowpaste</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .player-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); 
            text-align: center;
            width: 320px;
            border: 1px solid #eaeaea;
        }

        .track-name {
            font-size: 18px;
            color: #333;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .track-artist {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }

        .play-btn {
            background-color: #ffffff;
            border: 2px solid #8e44ad; 
            color: #8e44ad;
            width: 65px;
            height: 65px;
            border-radius: 50%; 
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease; 
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px auto;
            outline: none;
        }
        .play-btn:hover {
            background-color: #f4ecf7; 
            transform: scale(1.05); 
        }

        .telegram-link {
            display: inline-block;
            background-color: #ffffff;
            border: 2px solid #8e44ad; 
            color: #8e44ad;
            text-decoration: none; 
            padding: 10px 20px;
            border-radius: 12px; 
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .telegram-link:hover {
            background-color: #8e44ad; 
            color: #ffffff; 
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="myAudio">
        <source src="voice.mp3" type="audio/mpeg">
    </audio>

    <div class="player-container">
        <div class="track-name">voice.mp3</div>
        <div class="track-artist">Audio</div>

        <button class="play-btn" id="playBtn">
            <span id="playIcon">&#9658;</span>
        </button>

        <br>

        <a href="https://t.me/lowpaste" target="_blank" class="telegram-link">
            @lowpaste
        </a>
    </div>

    <script>
        const audio = document.getElementById('myAudio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');

        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playIcon.innerHTML = '&#9658;'; 
            } else {
                audio.play();
                playIcon.innerHTML = '&#10074;&#10074;';
                playIcon.style.fontSize = '22px'; 
            }
            isPlaying = !isPlaying;
        }
        playBtn.addEventListener('click', togglePlay);
        audio.addEventListener('ended', () => {
            isPlaying = false;
            playIcon.innerHTML = '&#9658;';
            playIcon.style.fontSize = '28px';
        });
    </script>

</body>
</html>
